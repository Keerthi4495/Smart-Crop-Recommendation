<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Irrigation Recommendation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="top-nav">
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/irrigation">Irrigation</a>
    </div>

    <div class="container">
        <h2>Irrigation Recommendation</h2>

        <form method="POST" action="/irrigation">
            <label>Crop:</label>
            <input type="text" name="crop_name" placeholder="Example: Maize" required>

            <label>Temperature:</label>
            <input type="number" step="any" name="temperature" required>

            <label>Humidity:</label>
            <input type="number" step="any" name="humidity" required>

            <label>Rainfall:</label>
            <input type="number" step="any" name="rainfall" required>

            <button type="submit">Check Irrigation</button>
        </form>

        {% if result %}
        <div class="success-box">
            <strong>{{ result }}</strong>
        </div>
        <p>{{ message }}</p>
        {% endif %}

        <div class="page-footer">
            <a href="/dashboard">Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
